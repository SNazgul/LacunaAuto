services:
  postgres:
    image: postgres:17-alpine
    container_name: lacunaauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lacunaauto
      POSTGRES_USER: lacunaauto
      POSTGRES_PASSWORD: lacunaauto_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lacunaauto_postgres_data:/var/lib/postgresql/data
    networks:
      - lacunaauto

  seq:
    image: datalust/seq:latest
    container_name: lacunaauto-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - lacunaauto_seq_data:/data
    networks:
      - lacunaauto

volumes:
  lacunaauto_postgres_data:
  lacunaauto_seq_data:

networks:
  lacunaauto:
    name: lacunaauto